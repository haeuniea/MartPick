# Local development database only. Credentials are for local use and can be overridden via environment variables.
services:
  postgres:
    image: postgres:16
    container_name: martpick-postgres
    environment:
      POSTGRES_DB: ${MARTPICK_DB_NAME:-martpick}
      POSTGRES_USER: ${MARTPICK_DB_USER:-martpick}
      POSTGRES_PASSWORD: ${MARTPICK_DB_PASSWORD:-martpick}
    ports:
      - "5432:5432"
    volumes:
      - martpick-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  martpick-pgdata:
