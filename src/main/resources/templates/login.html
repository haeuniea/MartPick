<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('login')}"></header>

<main class="container page page--tight">
	<div class="auth-shell">
		<div class="auth-heading">
			<h1 class="page-title">로그인</h1>
			<p class="page-lead">아이디와 비밀번호로 로그인합니다.</p>
		</div>

		<div th:replace="~{fragments/layout :: alerts}"></div>

		<form class="panel auth-panel" th:action="@{/login}" method="post" aria-labelledby="login-title">
			<h2 class="compare-panel__title" id="login-title"><span>계정 정보 입력</span></h2>

			<input type="hidden" name="continue" th:if="${continueUrl != null}" th:value="${continueUrl}">

			<label class="compare-panel__label" for="username">아이디</label>
			<input class="auth-input" type="text" id="username" name="username" maxlength="20"
				autocomplete="username" autocapitalize="none" spellcheck="false" required>

			<label class="compare-panel__label" for="password">비밀번호</label>
			<input class="auth-input" type="password" name="password" id="password"
				autocomplete="current-password" required>

			<p class="compare-panel__hint auth-notice">
				비회원으로 담은 상품은 로그인 후 장바구니에 자동으로 추가되지 않습니다.
			</p>

			<button class="button button--primary button--large button--block" type="submit">
				<span>로그인</span>
			</button>
			<p class="compare-panel__hint">아직 회원이 아니신가요?
				<a th:href="${continueUrl != null} ? @{/signup(continue=${continueUrl})} : @{/signup}">회원가입</a></p>
		</form>
	</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
