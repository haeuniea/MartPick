<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' · 마트픽'">마트픽</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- active: 현재 메뉴 ('products', 'cart', 'login', 'signup'). 해당 메뉴를 강조하고 aria-current를 붙인다.
	로그인 링크는 요청 속성 loginContinue(복귀를 허용하는 화면에서만 설정, LoginContinueConfig)를 continue로 넘긴다. -->
<header class="site-header" th:fragment="header(active)">
	<div class="container site-header__inner">
		<a class="brand" th:href="@{/products}" aria-label="마트픽 홈">
			<svg th:replace="~{fragments/icons :: logo}"></svg>
			<span class="brand__name">마트픽</span>
		</a>
		<nav class="site-nav" aria-label="주요 메뉴">
			<a class="site-nav__link" th:href="@{/products}"
				th:classappend="${active == 'products'} ? 'is-active'"
				th:attr="aria-current=${active == 'products'} ? 'page' : null">
				<svg th:replace="~{fragments/icons :: search}"></svg><span>상품 찾기</span>
			</a>
			<a class="site-nav__link" th:href="@{/cart}"
				th:classappend="${active == 'cart'} ? 'is-active'"
				th:attr="aria-current=${active == 'cart'} ? 'page' : null">
				<svg th:replace="~{fragments/icons :: cart}"></svg><span>장바구니</span>
			</a>
		</nav>
		<div class="site-auth" sec:authorize="isAuthenticated()">
			<span class="site-auth__name"><strong sec:authentication="name">회원</strong>님</span>
			<form th:action="@{/logout}" method="post">
				<button class="button button--secondary button--small" type="submit">로그아웃</button>
			</form>
		</div>
		<div class="site-auth" sec:authorize="!isAuthenticated()">
			<a class="site-nav__link" th:classappend="${active == 'login'} ? 'is-active'"
				th:href="${loginContinue != null and active != 'login' and active != 'signup'} ? @{/login(continue=${loginContinue})} : @{/login}"
				th:attr="aria-current=${active == 'login'} ? 'page' : null"><span>로그인</span></a>
			<a class="site-nav__link" th:classappend="${active == 'signup'} ? 'is-active'" th:href="@{/signup}"
				th:attr="aria-current=${active == 'signup'} ? 'page' : null"><span>회원가입</span></a>
		</div>
	</div>
</header>

<div class="alerts" th:fragment="alerts" th:if="${message != null or error != null}">
	<p class="alert alert--success" role="status" th:if="${message != null}">
		<svg th:replace="~{fragments/icons :: check}"></svg><span th:text="${message}">담았습니다.</span>
	</p>
	<p class="alert alert--error" role="alert" th:if="${error != null}">
		<svg th:replace="~{fragments/icons :: alert}"></svg><span th:text="${error}">오류</span>
	</p>
</div>

<section class="survey-notice" th:fragment="surveyNotice(inspectDay)" aria-label="가격 기준 안내">
	<div class="container survey-notice__inner">
		<span class="survey-notice__icon"><svg th:replace="~{fragments/icons :: calendar}"></svg></span>
		<div>
			<p class="survey-notice__day">
				<strong th:text="${#temporals.format(inspectDay, 'yyyy년 M월 d일')}">2026년 9월 25일</strong> 조사 가격 기준
			</p>
			<p class="survey-notice__caution">한국소비자원 생필품 가격 정보의 조사 가격이며, 실시간 판매 가격·재고를 보장하지 않습니다.</p>
		</div>
	</div>
</section>

<!-- 오류 화면 본문. code가 null이면 오류 코드 줄을 표시하지 않는다. 제목과 설명은 고정 문구만 받으며 오류 내용을 담지 않는다. -->
<main class="container page page--tight" th:fragment="errorPanel(code, title, text)">
	<div class="empty" role="alert">
		<span class="empty__icon"><svg th:replace="~{fragments/icons :: alert}"></svg></span>
		<p class="empty__title" th:text="${title}">페이지를 찾을 수 없습니다</p>
		<p class="empty__text" th:text="${text}">주소가 올바른지 확인해 주세요.</p>
		<p class="empty__text" th:if="${code != null}" th:text="|오류 코드 ${code}|">오류 코드 404</p>
		<a class="button button--primary" th:href="@{/products}">
			<svg th:replace="~{fragments/icons :: search}"></svg><span>상품 찾기로 이동</span>
		</a>
		<a class="button button--secondary" th:href="@{/cart}">
			<svg th:replace="~{fragments/icons :: cart}"></svg><span>장바구니 보기</span>
		</a>
	</div>
</main>

<footer class="site-footer" th:fragment="footer">
	<div class="container">
		<p>가격 출처: 한국소비자원 생필품 가격 정보 (공공데이터포털)</p>
	</div>
</footer>

</body>
</html>
