<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 화면 전용 선 아이콘. 외부 이미지·아이콘 라이브러리 없이 currentColor로 색을 따른다. -->
<body>

<svg th:fragment="logo" class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
	<rect width="32" height="32" rx="9" fill="currentColor"/>
	<path d="M8 12.5h16l-1.6 9.2a2 2 0 0 1-2 1.7h-8.8a2 2 0 0 1-2-1.7L8 12.5Z" fill="#fff"/>
	<path d="M12 12.5 15 7.5M20 12.5 17 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
	<path d="M12.6 17.2h6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>

<svg th:fragment="search" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
	<path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>

<svg th:fragment="cart" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M3 4h2.2l2.1 10.2a1.8 1.8 0 0 0 1.8 1.4h8.3a1.8 1.8 0 0 0 1.7-1.3L20.8 8H6.2" fill="none"
		stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
	<circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/>
	<circle cx="17" cy="19.5" r="1.4" fill="currentColor"/>
</svg>

<svg th:fragment="calendar" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
	<path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>

<svg th:fragment="pin" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z" fill="none" stroke="currentColor"
		stroke-width="1.9" stroke-linejoin="round"/>
	<circle cx="12" cy="10" r="2.3" fill="currentColor"/>
</svg>

<svg th:fragment="trash" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12a1.8 1.8 0 0 0 1.8 1.6h5.6a1.8 1.8 0 0 0 1.8-1.6l.9-12M10 11v6M14 11v6"
		fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg th:fragment="arrowLeft" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
		stroke-linejoin="round"/>
</svg>

<svg th:fragment="arrowRight" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
		stroke-linejoin="round"/>
</svg>

<svg th:fragment="chevron" class="icon icon--chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
		stroke-linejoin="round"/>
</svg>

<svg th:fragment="info" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
	<path d="M12 11v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
	<circle cx="12" cy="8" r="1.1" fill="currentColor"/>
</svg>

<svg th:fragment="alert" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
	<path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
	<circle cx="12" cy="16.3" r="1.1" fill="currentColor"/>
</svg>

<svg th:fragment="check" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
		stroke-linejoin="round"/>
</svg>

<svg th:fragment="store" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
	<path d="M4 9.5 5.5 4.5h13L20 9.5M4 9.5h16M4 9.5v0a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12.3V20h13v-7.7M10 20v-4.5h4V20"
		fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

</body>
</html>
