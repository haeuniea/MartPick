<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('signup')}"></header>

<main class="container page page--tight">
	<div class="page-heading">
		<div>
			<h1 class="page-title">회원가입</h1>
			<p class="page-lead">아이디와 비밀번호만으로 가입할 수 있습니다.</p>
		</div>
	</div>

	<form class="panel auth-panel" th:action="@{/signup}" th:object="${signupForm}" method="post"
		aria-labelledby="signup-title">
		<h2 class="compare-panel__title" id="signup-title"><span>가입 정보 입력</span></h2>

		<div class="alerts" th:if="${#fields.hasErrors('*')}">
			<ul class="alert alert--error auth-errors" role="alert">
				<li th:each="message : ${#fields.allErrors()}" th:text="${message}">오류</li>
			</ul>
		</div>

		<label class="compare-panel__label" for="username">아이디</label>
		<input class="auth-input" type="text" id="username" th:field="*{username}" maxlength="20"
			autocomplete="username" autocapitalize="none" spellcheck="false" required>
		<p class="compare-panel__hint">영문·숫자 4~20자 (대소문자를 구분합니다)</p>

		<label class="compare-panel__label" for="password">비밀번호</label>
		<input class="auth-input" type="password" name="password" id="password"
			autocomplete="new-password" required>
		<p class="compare-panel__hint">8자 이상, 72바이트 이하 (한글은 한 글자가 3바이트입니다)</p>

		<label class="compare-panel__label" for="passwordConfirm">비밀번호 확인</label>
		<input class="auth-input" type="password" name="passwordConfirm" id="passwordConfirm"
			autocomplete="new-password" required>

		<button class="button button--primary button--large button--block" type="submit">
			<span>가입하기</span>
		</button>
	</form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
