spring:
  application:
    name: martpick
  datasource:
    url: jdbc:postgresql://${MARTPICK_DB_HOST:localhost}:${MARTPICK_DB_PORT:5432}/${MARTPICK_DB_NAME:martpick}
    username: ${MARTPICK_DB_USER:martpick}
    password: ${MARTPICK_DB_PASSWORD:martpick}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

martpick:
  inspect-day: 2026-09-25
  collect:
    run: false
    good-ids: [1000, 1003, 1008, 292, 254, 224, 993]
    excluded-store-ids: [62, 115, 150, 2160]
    allow-shrink: false
  public-data:
    base-url: https://apis.data.go.kr/B551919/ProductPriceInfoService
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    connect-timeout: 5s
    read-timeout: 30s
