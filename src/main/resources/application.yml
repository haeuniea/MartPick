spring:
  application:
    name: martpick
  # 4단계(비회원 기능): 자동 생성 사용자와 generated password를 만들지 않음. 5단계 인증 구현 시 다시 조정
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${MARTPICK_DB_HOST:localhost}:${MARTPICK_DB_PORT:5432}/${MARTPICK_DB_NAME:martpick}
    username: ${MARTPICK_DB_USER:martpick}
    password: ${MARTPICK_DB_PASSWORD:martpick}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

martpick:
  inspect-day: 2026-09-25
  collect:
    run: false
    # 기준 상품: 수집 범위가 아니라 필수 검증(V2, V4)과 회귀 검증에 사용. 수집은 상품 API 응답의 전체 상품 대상
    baseline-good-ids: [1000, 1003, 1008, 292, 254, 224, 993]
    excluded-store-ids: [62, 115, 150, 2160]
    allow-shrink: false
    # 네트워크 오류·타임아웃·HTTP 5xx만 재시도 (PROJECT_SPEC 4-1-1)
    retry-delays: [1s, 2s]
    max-total-retries: 30
  public-data:
    base-url: https://apis.data.go.kr/B551919/ProductPriceInfoService
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    connect-timeout: 5s
    read-timeout: 30s
